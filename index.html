<body>
<!-- Static forms so Netlify detects them at build time -->
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input name="bot-field" /><input name="name" /><input name="email" /><input name="company" /><input name="country" /><input name="enquiryType" /><input name="service" /><textarea name="message"></textarea><input name="budget" /><input name="consent" />
</form>
<form name="talent" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input name="bot-field" /><input name="name" /><input name="email" /><input name="area" /><input name="profileUrl" /><textarea name="message"></textarea><input name="consent" />
</form>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
